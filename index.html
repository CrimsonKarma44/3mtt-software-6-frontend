`<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URD - Authentication</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Phosphor Icons for precise modern icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <canvas id="background-canvas"></canvas>

    <main class="auth-container">
        
        <div class="auth-card">
            
            <!-- TABS -->
            <div class="auth-tabs">
                <button class="tab active" data-target="signin-view">Sign In</button>
                <button class="tab" data-target="signup-view">Sign Up</button>
            </div>

            <!-- ======================= SIGN IN VIEW ======================= -->
            <div class="view active" id="signin-view">
                <h2>Welcome back 👏</h2>
                <p class="subtitle">Sign in to continue your interview prep journey.</p>
                
                <form id="signin-form" class="auth-form">
                    <div class="input-group">
                        <label for="signin-email">EMAIL</label>
                        <div class="input-wrapper">
                            <i class="ph ph-envelope"></i>
                            <input type="email" id="signin-email" placeholder="you@example.com" required>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="signin-password">PASSWORD</label>
                        <div class="input-wrapper">
                            <i class="ph ph-lock"></i>
                            <input type="password" id="signin-password" placeholder="••••••••" required>
                            <button type="button" class="icon-btn"><i class="ph ph-eye"></i></button>
                        </div>
                    </div>

                    <div class="form-row">
                        <label class="remember-me">
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="submit-btn" id="signin-submit-btn">Sign In</button>
                </form>

                <div class="divider">
                    <span>or continue with</span>
                </div>

                <div class="social-buttons">
                    <button class="social-btn">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                        Google
                    </button>
                    <button class="social-btn">
                        <!-- We use an inline white GitHub svg since the background is dark -->
                        <svg xmlns="http://www.svg-core.com" width="18" height="18" fill="white" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                        GitHub
                    </button>
                </div>
            </div>

            <!-- ======================= SIGN UP VIEW ======================= -->
            <div class="view" id="signup-view">
                <h2>Create account 🚀</h2>
                <p class="subtitle">Join us to jumpstart your interview prep.</p>
                
                <form id="signup-form" class="auth-form">
                    <div class="input-group">
                        <label for="signup-name">FULL NAME</label>
                        <div class="input-wrapper">
                            <i class="ph ph-user"></i>
                            <input type="text" id="signup-name" placeholder="John Doe" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="signup-email">EMAIL</label>
                        <div class="input-wrapper">
                            <i class="ph ph-envelope"></i>
                            <input type="email" id="signup-email" placeholder="you@example.com" required>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="signup-password">PASSWORD</label>
                        <div class="input-wrapper">
                            <i class="ph ph-lock"></i>
                            <input type="password" id="signup-password" placeholder="••••••••" required>
                            <button type="button" class="icon-btn"><i class="ph ph-eye"></i></button>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" style="margin-top: 15px;">Sign Up</button>
                </form>

                <div class="divider">
                    <span>or continue with</span>
                </div>

                <div class="social-buttons">
                    <button class="social-btn">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                        Google
                    </button>
                    <button class="social-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="white" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                        GitHub
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
