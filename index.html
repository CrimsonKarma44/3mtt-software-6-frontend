<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URD - Authentication</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Phosphor Icons for precise modern icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <canvas id="background-canvas"></canvas>

    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="theme-toggle-btn">
        <i class="ph ph-sun"></i>
    </button>

    <main class="auth-container">

        <div class="auth-card">

            <!-- TABS -->
            <div class="auth-tabs">
                <button class="tab active" data-target="signin-view">Sign In</button>
                <button class="tab" data-target="signup-view">Sign Up</button>
            </div>

            <!-- ======================= SIGN IN VIEW ======================= -->
            <div class="view active" id="signin-view">
                <h2>Welcome back 👏</h2>
                <p class="subtitle">Sign in to continue your interview prep journey.</p>

                <form id="signin-form" class="auth-form">
                    <div class="input-group">
                        <label for="signin-email">EMAIL</label>
                        <div class="input-wrapper">
                            <i class="ph ph-envelope"></i>
                            <input type="email" id="signin-email" placeholder="you@example.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="signin-password">PASSWORD</label>
                        <div class="input-wrapper">
                            <i class="ph ph-lock"></i>
                            <input type="password" id="signin-password" placeholder="••••••••" required>
                            <button type="button" class="icon-btn"><i class="ph ph-eye"></i></button>
                        </div>
                    </div>

                    <div class="form-row">
                        <label class="remember-me">
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="submit-btn" id="signin-submit-btn">Sign In</button>
                </form>

                <div class="divider">
                    <span>or continue with</span>
                </div>

                <div class="social-buttons">
                    <button class="social-btn">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                        Google
                    </button>
                    <button class="social-btn">
                        <!-- LinkedIn icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#0077b5"
                            viewBox="0 0 24 24">
                            <path
                                d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
                        </svg>
                        LinkedIn
                    </button>
                </div>
            </div>

            <!-- ======================= SIGN UP VIEW ======================= -->
            <div class="view" id="signup-view">
                <h2>Create account 🚀</h2>
                <p class="subtitle">Join us to jumpstart your interview prep.</p>

                <form id="signup-form" class="auth-form">
                    <div class="input-group">
                        <label for="signup-name">FULL NAME</label>
                        <div class="input-wrapper">
                            <i class="ph ph-user"></i>
                            <input type="text" id="signup-name" placeholder="John Doe" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="signup-email">EMAIL</label>
                        <div class="input-wrapper">
                            <i class="ph ph-envelope"></i>
                            <input type="email" id="signup-email" placeholder="you@example.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="signup-password">PASSWORD</label>
                        <div class="input-wrapper">
                            <i class="ph ph-lock"></i>
                            <input type="password" id="signup-password" placeholder="••••••••" required>
                            <button type="button" class="icon-btn"><i class="ph ph-eye"></i></button>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" style="margin-top: 15px;">Sign Up</button>
                </form>

                <div class="divider">
                    <span>or continue with</span>
                </div>

                <div class="social-buttons">
                    <button class="social-btn">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                        Google
                    </button>
                    <button class="social-btn">
                        <!-- LinkedIn icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#0077b5"
                            viewBox="0 0 24 24">
                            <path
                                d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
                        </svg>
                        LinkedIn
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
